name: unpack
on:
  push:
    paths: ['site.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o site.zip -d . && rm site.zip
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -m "unpack site" && git push
